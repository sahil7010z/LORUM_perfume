<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Velours Or perfume bottle">
  <defs>
    <linearGradient id="bgb2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0907"/>
      <stop offset="1" stop-color="#070504"/>
    </linearGradient>
    <radialGradient id="glowb2" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#c8a14e" stop-opacity="0.34"/>
      <stop offset="0.4" stop-color="#c8a14e" stop-opacity="0.10"/>
      <stop offset="0.75" stop-color="#070504" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassb2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8a14e" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#c8a14e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0d0907" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="capb2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecc878"/>
      <stop offset="0.55" stop-color="#c8a14e"/>
      <stop offset="1" stop-color="#7c5e26"/>
    </linearGradient>
    <radialGradient id="floorb2" cx="50%" cy="100%" r="55%">
      <stop offset="0" stop-color="#c8a14e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#070504" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1100" fill="url(#bgb2)"/>
  <rect width="800" height="1100" fill="url(#glowb2)"/>
  <rect width="800" height="1100" fill="url(#floorb2)"/>

  <!-- thin gold hairline ring behind the bottle -->
  <circle cx="400" cy="470" r="250" fill="none" stroke="#c8a14e" stroke-opacity="0.45" stroke-width="1.5"/>
  <circle cx="400" cy="470" r="190" fill="none" stroke="#ecc878" stroke-opacity="0.18" stroke-width="0.8"/>

  <!-- bottle silhouette: shoulder, body, neck, cap -->
  <g>
    <!-- body -->
    <rect x="300" y="360" width="200" height="380" rx="26" fill="url(#glassb2)" stroke="#c8a14e" stroke-opacity="0.55" stroke-width="2"/>
    <!-- inner liquid -->
    <rect x="318" y="470" width="164" height="252" rx="16" fill="#c8a14e" fill-opacity="0.28"/>
    <!-- glass highlight -->
    <rect x="322" y="378" width="34" height="344" rx="16" fill="#ecc878" fill-opacity="0.10"/>
    <!-- shoulder -->
    <path d="M330 362 C 340 332 460 332 470 362 Z" fill="url(#glassb2)" stroke="#c8a14e" stroke-opacity="0.5" stroke-width="2"/>
    <!-- neck -->
    <rect x="372" y="318" width="56" height="52" fill="#0d0907" stroke="#c8a14e" stroke-opacity="0.5" stroke-width="2"/>
    <!-- cap -->
    <rect x="360" y="250" width="80" height="76" rx="6" fill="url(#capb2)" stroke="#7c5e26" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="360" y="250" width="80" height="14" rx="6" fill="#ecc878" fill-opacity="0.65"/>
    <!-- engraved A monogram on the body -->
    <text x="400" y="600" text-anchor="middle" font-family="Cormorant Garamond, Georgia, 'Times New Roman', serif" font-size="150" font-weight="500" fill="#ecc878" fill-opacity="0.55" letter-spacing="2">L</text>
  </g>

  <!-- index number -->
  <text x="400" y="180" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="34" font-weight="400" fill="#a99e88" letter-spacing="8">03</text>

  <!-- name + subtitle -->
  <text x="400" y="880" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="58" font-weight="500" fill="#ecc878" letter-spacing="6">Velours Or</text>
  <text x="400" y="930" text-anchor="middle" font-family="Jost, Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#a99e88" letter-spacing="6" style="text-transform:uppercase">REFINED CLASSIC LUXURY</text>

  <!-- house wordmark -->
  <text x="400" y="1030" text-anchor="middle" font-family="Jost, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#c8a14e" fill-opacity="0.8" letter-spacing="14">LORUM</text>
</svg>
